<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CONSULTA - TRABAJO EN ALTURA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin-top: 20px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .logo-container img { height: 60px; }
        .filter-box { background: #1e293b; padding: 20px; border-radius: 15px; display: flex; gap: 15px; align-items: center; justify-content: center; }
        button { background: #22c55e; color: white; font-weight: bold; padding: 10px 20px; border-radius: 8px; border: none; }
        table { width: 100%; margin-top: 20px; background: white; color: #0f172a; border-radius: 10px; overflow: hidden; }
        th { background: #334155; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
        <strong>HISTORIAL_CLINICO</strong>
    </div>
    <div class="header text-center">
        <a href="consultas.html" class="btn btn-secondary btn-sm mb-3">← VOLVER</a>
        <h2>CONSULTA DE TRABAJO CON ALTURA</h2>
    </div>
    <div class="filter-box">
        <select id="campoSelect" class="form-select w-50">
            <option value="soplo_cardiaco">SOPLO CARDIACO</option>
            <option value="arritmias_cardiacas">ARRITMIAS CARDIACAS</option>
            <option value="nistagmus">NISTAGMUS</option>
            <option value="test_romberg">TEST DE ROMBERG</option>
            <option value="test_barany">TEST DE LOS INDICES DE BARANY</option>
            <option value="test_babinsky">TEST DE BABINSKY</option>
        </select>
        <button onclick="filtrar()">BUSCAR</button>
    </div>
    <table class="table table-bordered">
        <thead><tr><th>CÓDIGO</th><th>NOMBRE COMPLETO</th><th>ESTADO</th></tr></thead>
        <tbody id="listaPacientes"></tbody>
    </table>
</div>
<script>
    const API = 'https://historial-clinico-nube.onrender.com';
    async function filtrar() {
        const campo = document.getElementById('campoSelect').value;
        const tbody = document.getElementById('listaPacientes');
        tbody.innerHTML = "<tr><td colspan='3' class='text-center'>CARGANDO...</td></tr>";
        try {
            const res = await fetch(`${API}/filtrar-altura/${campo}`);
            const resultados = await res.json();
            tbody.innerHTML = resultados.length === 0 
                ? "<tr><td colspan='3' class='text-center'>NO SE ENCONTRARON REGISTROS</td></tr>"
                : resultados.map(item => `<tr><td>${item.codigo}</td><td>${item.nombre}</td><td>${item.estado}</td></tr>`).join('');
        } catch (e) {
            alert("Error al conectar con la nube. Verifica la consola.");
            tbody.innerHTML = "";
        }
    }
</script>
</body>
</html>
