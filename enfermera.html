<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC NUBE | Menú Enfermería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
</head>
<body style="transform: scale(1.10); transform-origin: top center;" class="bg-slate-950 flex flex-col items-center justify-center min-h-screen p-4">

    <a href="index.html" class="mb-12 text-[12.5px] font-bold text-slate-500 uppercase tracking-[0.3em] hover:text-blue-400 transition-colors">
        ← Volver al Portal Principal
    </a>

    <div class="text-center">
        <h1 class="text-emerald-500 text-3xl font-bold uppercase tracking-tighter mb-2">Área de Enfermería</h1>

        <div class="flex flex-col gap-6 w-80">
            <button onclick="location.href='registro_paciente.html'" class="py-8 bg-slate-900 rounded-2xl border border-slate-800 hover:border-emerald-500 transition-all group">

                <span class="text-[12.5px] font-bold text-slate-300 uppercase tracking-widest">Registro de Paciente</span>
            </button>

            <button onclick="location.href='d_menu.html'" class="py-8 bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all group">
                <span class="block text-3xl mb-2 group-hover:scale-110 transition-transform">📋</span>
                <span class="text-[12.5px] font-bold text-slate-300 uppercase tracking-widest text-center">Especialidades</span>
            </button>
        </div>

        <div class="mt-12">
            <p class="text-slate-700 text-[12.5px] uppercase tracking-widest font-medium">Sistema de Gestión Hospitalaria v1.0</p>
        </div>
    </div>

</html>
