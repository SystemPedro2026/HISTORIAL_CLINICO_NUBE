<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HC NUBE | Menú Enfermería (Ajustado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
</head>
<body class="bg-slate-950 flex flex-col items-center justify-center min-h-screen p-6">

    <a href="index.html" class="mb-[12.5px] text-[12.5px] font-bold text-slate-500 uppercase tracking-[0.3em] hover:text-blue-400 transition-colors">
        ← Volver al Portal Principal
    </a>

    <div class="text-center">
        <h1 class="text-emerald-500 text-[30px] font-bold uppercase tracking-tighter mb-[1.25px]">Área de Enfermería</h1>
        <p class="text-slate-500 text-[11.25px] uppercase tracking-[0.3em] mb-[15px]">Seleccione la tarea a realizar</p>

        <div class="flex flex-col gap-5 w-[80px]">
            <button onclick="location.href='registro_paciente.html'" class="py-[7.5px] bg-slate-900 rounded-2xl border border-slate-800 hover:border-emerald-500 transition-all group">
                <span class="block text-[30px] mb-[1.25px] group-hover:scale-110 transition-transform">📝</span>
                <span class="text-[12.5px] font-bold text-slate-300 uppercase tracking-widest leading-snug">Registro de Paciente</span>
            </button>

            <button onclick="location.href='d_menu.html'" class="py-[7.5px] bg-slate-900 rounded-2xl border border-slate-800 hover:border-blue-500 transition-all group">
                <span class="block text-[30px] mb-[1.25px] group-hover:scale-110 transition-transform">📋</span>
                <span class="text-[12.5px] font-bold text-slate-300 uppercase tracking-widest text-center leading-snug">Especialidades</span>
            </button>
        </div>
        <div class="mt-[12.5px]">
            <p class="text-slate-700 text-[12.5px] uppercase tracking-widest font-medium">Sistema de Gestión Hospitalaria v1.0</p>
        </div>
    </div>
</body>
</html>
