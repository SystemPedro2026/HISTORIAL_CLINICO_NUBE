<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ficha Psicológica Completa</title>
    <style>
        :root { --emerald: #28a745; }
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; text-transform: uppercase; }
        body { background: #dcdcdc; padding: 20px; }
        .form-container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1.5px solid #000; }
        .codigo-container { background: #f8f9fa; border: 1px solid #ced4da; padding: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        input[type="text"], textarea { border: none; border-bottom: 1px solid #000; width: 100%; padding: 5px; font-size: 12px; outline: none; }
        textarea { border: 1px solid #000; min-height: 60px; }
        .section { margin-bottom: 20px; border: 1px solid #000; padding: 10px; }
        .section-title { font-weight: bold; font-size: 14px; background: #f3f3f3; padding: 5px; margin-bottom: 10px; }
        .btn-save { width: 100%; background: #2d73f5; color: white; padding: 15px; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="codigo-container">
        <label>CÓDIGO PACIENTE:</label>
        <input type="text" id="codigo_paciente" placeholder="CÓDIGO PACIENTE">
    </div>

    <div class="section">
        <div class="section-title">I. HISTORIA Y HÁBITOS</div>
        <input type="text" id="historia_familiar" placeholder="HISTORIA FAMILIAR">
        <input type="text" id="habitos_alcohol" placeholder="ALCOHOL">
        <input type="text" id="habitos_tabaco" placeholder="TABACO">
        <input type="text" id="habitos_drogas" placeholder="DROGAS">
        <input type="text" id="habitos_coquear" placeholder="COQUEAR">
    </div>

    <div class="section">
        <div class="section-title">II. EXAMEN MENTAL</div>
        <input type="text" id="presentacion" placeholder="PRESENTACIÓN">
        <input type="text" id="postura" placeholder="POSTURA">
        <input type="text" id="conducta" placeholder="CONDUCTA">
        <input type="text" id="pensamiento" placeholder="PENSAMIENTO">
        <input type="text" id="discurso" placeholder="DISCURSO">
        <input type="text" id="percepcion" placeholder="PERCEPCIÓN">
        <input type="text" id="memoria" placeholder="MEMORIA">
        <input type="text" id="lucido_atento" placeholder="LUCIDO/ATENTO">
        <input type="text" id="articulacion_palabra" placeholder="ARTICULACIÓN">
        <input type="text" id="apetito" placeholder="APETITO">
        <input type="text" id="sueno" placeholder="SUEÑO">
        <input type="text" id="orientacion" placeholder="ORIENTACIÓN">
        <input type="text" id="personalidad" placeholder="PERSONALIDAD">
        <input type="text" id="afectividad" placeholder="AFECTIVIDAD">
        <input type="text" id="conducta_sexual" placeholder="CONDUCTA SEXUAL">
    </div>

    <div class="section">
        <div class="section-title">III. TEST Y CONCLUSIONES</div>
        <input type="text" id="nombre_prueba" placeholder="NOMBRE PRUEBA">
        <input type="text" id="puntaje_test" placeholder="PUNTAJE">
        <textarea id="observaciones_test" placeholder="OBSERVACIONES TEST"></textarea>
        <textarea id="otras_observaciones" placeholder="OTRAS OBSERVACIONES"></textarea>
    </div>

    <div class="section">
        <div class="section-title">VIII. RESULTADO FINAL</div>
        <select id="psicologicamente" style="width:100%; padding:10px;">
            <option value="APTO">APTO</option>
            <option value="APTO CON RECOMENDACIONES">APTO CON RECOMENDACIONES</option>
            <option value="NO APTO">NO APTO</option>
        </select>
    </div>

    <button class="btn-save" onclick="guardarFicha()">💾 GUARDAR REGISTRO COMPLETO</button>
</div>

<script>
    async function guardarFicha() {
        const codigoInput = document.getElementById('codigo_paciente').value;
        
        // 1. Obtener ID real del paciente
        const resId = await fetch(`https://historial-clinico-nube.onrender.com/buscar-id-por-codigo/${codigoInput}`);
        if (!resId.ok) { alert("Paciente no encontrado"); return; }
        const dataP = await resId.json();

        // 2. Construir objeto con TODOS los campos
        const campos = [
            "historia_familiar", "habitos_alcohol", "habitos_tabaco", "habitos_drogas", 
            "habitos_coquear", "otras_observaciones", "conducta", "presentacion", 
            "postura", "lucido_atento", "pensamiento", "discurso", "percepcion", 
            "memoria", "articulacion_palabra", "apetito", "sueno", "orientacion", 
            "personalidad", "afectividad", "conducta_sexual", "puntaje_test", 
            "nombre_prueba", "observaciones_test", "psicologicamente"
        ];
        
        let payload = { paciente_id: dataP.id };
        campos.forEach(c => payload[c] = document.getElementById(c).value);

        // 3. Guardar
        const res = await fetch('https://historial-clinico-nube.onrender.com/guardar-psicologia/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if(res.ok) alert("GUARDADO CON ÉXITO");
        else alert("ERROR AL GUARDAR");
    }
</script>
</body>
</html>
