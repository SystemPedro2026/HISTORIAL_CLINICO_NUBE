<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA - DECLARACIÓN JURADA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin-top: 30px; }
        .header { text-align: center; margin-bottom: 30px; }
        .filter-box { background: #1e293b; padding: 20px; border-radius: 15px; display: flex; gap: 10px; align-items: center; justify-content: center; }
        select, button { padding: 10px; border-radius: 8px; border: none; }
        button { background: #22c55e; color: white; font-weight: bold; }
        table { width: 100%; margin-top: 20px; background: white; color: #0f172a; border-radius: 10px; overflow: hidden; }
        th { background: #334155; color: white; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="consultas.html" class="btn btn-secondary btn-sm mb-3 no-print">← VOLVER</a>
        <h2>CONSULTA DE DECLARACIÓN JURADA</h2>
    </div>

    <div class="filter-box no-print">
        <select id="patologiaSelect" class="form-select w-50">
            <option value="vista">1. VISTA</option>
            <option value="auditivo">2. AUDITIVO</option>
            <option value="respiratorio">3. RESPIRATORIO</option>
            <option value="cardio">4. CARDIOVASCULARES</option>
            <option value="digestivos">5. DIGESTIVOS</option>
            <option value="sangre">6. SANGRE</option>
            <option value="genitourinario">7. GENITOURINARIO</option>
            <option value="sistema_nervioso">8. SISTEMA NERVIOSO</option>
            <option value="psiquiatricos">9. PSIQUIÁTRICOS</option>
            <option value="osteomusculares">10. OSTEOMUSCULARES</option>
            <option value="reumatologicos">11. REUMATOLÓGICOS</option>
            <option value="dermatologicas">12. DERMATOLÓGICAS</option>
            <option value="alergias">13. ALERGIAS</option>
            <option value="cirugias">14. CIRUGÍAS</option>
            <option value="infecciones">15. INFECCIONES</option>
            <option value="acc_personales">16. ACCIDENTES PERS.</option>
            <option value="acc_trabajo">17. ACCIDENTES TRABAJO</option>
            <option value="medicamentos">18. MEDICAMENTOS</option>
            <option value="endocrino">19. ENDOCRINO</option>
            <option value="familiares">20. ANTECEDENTES FAM.</option>
            <option value="otros_especificos">21. OTROS ESPECÍFICOS</option>
            <option value="generales">22. GENERALES</option>
        </select>
        <button onclick="filtrar()">BUSCAR</button>
    </div>

    <table class="table table-bordered" id="tablaResultados">
        <thead>
            <tr>
                <th>CÓDIGO</th>
                <th>NOMBRE COMPLETO</th>
                <th>EDAD</th>
                <th>PROFESIÓN</th>
                <th>DETALLE</th>
            </tr>
        </thead>
        <tbody id="listaPacientes"></tbody>
    </table>

    <div class="text-center mt-4 no-print">
        <button onclick="window.print()" class="btn btn-primary">IMPRIMIR RESULTADOS</button>
    </div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    async function filtrar() {
        const campo = document.getElementById('patologiaSelect').value;
        const tbody = document.getElementById('listaPacientes');
        tbody.innerHTML = "<tr><td colspan='5' class='text-center'>CARGANDO...</td></tr>";

        try {
            // Obtenemos todos los expedientes (ajusta la ruta según tu endpoint global)
            const res = await fetch(`${API}/api/pacientes-completos`); 
            const data = await res.json();
            
            tbody.innerHTML = "";
            let encontrados = 0;

            data.forEach(p => {
                const valor = p.p2 ? p.p2[campo] : "NORMAL";
                
                // Filtro: Solo mostrar si NO es NORMAL y existe
                if (valor && valor.toUpperCase() !== "NORMAL") {
                    encontrados++;
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.paciente.codigo_paciente}</td>
                            <td>${p.paciente.apellido} ${p.paciente.nombre}</td>
                            <td>${p.filiacion?.edad || '---'}</td>
                            <td>${p.filiacion?.profesion_oficio || '---'}</td>
                            <td>${valor}</td>
                        </tr>
                    `;
                }
            });

            if (encontrados === 0) tbody.innerHTML = "<tr><td colspan='5' class='text-center'>NO SE ENCONTRARON PACIENTES CON ESTA PATOLOGÍA</td></tr>";
            
        } catch (e) {
            alert("Error al conectar con la nube.");
            tbody.innerHTML = "";
        }
    }
</script>

</body>
</html>
