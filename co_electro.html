<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA - ELECTROENCEFALOGRAMA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin-top: 20px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #e2e8f0; }
        .logo-container img { height: 60px; }
        .header { text-align: center; margin-bottom: 30px; }
        .filter-box { background: #1e293b; padding: 20px; border-radius: 15px; display: flex; gap: 15px; align-items: center; justify-content: center; }
        .label-patologias { font-weight: bold; font-size: 1.1rem; color: #ffffff; }
        select, button { padding: 10px; border-radius: 8px; border: none; }
        button { background: #22c55e; color: white; font-weight: bold; }
        table { width: 100%; margin-top: 20px; background: white; color: #0f172a; border-radius: 10px; overflow: hidden; }
        th { background: #334155; color: white; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
        <strong>HISTORIAL_CLINICO</strong>
    </div>

    <div class="header">
        <a href="consultas.html" class="btn btn-secondary btn-sm mb-3 no-print">← VOLVER</a>
        <h2>CONSULTA DE EVALUACIÓN ELECTROENCEFALOGRAMA</h2>
    </div>

    <div class="filter-box no-print">
        <span class="label-patologias">ANTECEDENTES</span>
        <select id="campoSelect" class="form-select w-50">
            <option value="cefaleas">CEFALEAS</option>
            <option value="epilepsia">EPILEPSIA</option>
            <option value="convulsiones">CONVULSIONES</option>
            <option value="perdida_conocimiento">PÉRDIDA DE CONOCIMIENTO</option>
            <option value="paralisis">PARÁLISIS</option>
            <option value="accidente">ACCIDENTE</option>
            <option value="derrame_cerebral">DERRAME CEREBRAL</option>
            <option value="quirurgicos">QUIRÚRGICOS</option>
        </select>
        <button onclick="filtrar()">BUSCAR</button>
    </div>

    <table class="table table-bordered" id="tablaResultados">
        <thead>
            <tr>
                <th>CÓDIGO PACIENTE</th>
                <th>NOMBRE COMPLETO</th>
                <th>VALOR REGISTRADO</th>
            </tr>
        </thead>
        <tbody id="listaPacientes"></tbody>
    </table>

    <div class="text-center mt-4 no-print">
        <button onclick="window.print()" class="btn btn-primary">IMPRIMIR RESULTADOS</button>
    </div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

async function filtrar() {
    const campo = document.getElementById('campoSelect').value;
    const tbody = document.getElementById('listaPacientes');
    tbody.innerHTML = "<tr><td colspan='3' class='text-center'>CARGANDO...</td></tr>";

    try {
        const res = await fetch(`${API}/consultar-electro-por-campo/${campo}`);
        const resultados = await res.json();
        
        tbody.innerHTML = "";
        
        // Verificación de seguridad antes de iterar
        if (!Array.isArray(resultados) || resultados.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' class='text-center'>NO HAY DATOS</td></tr>";
            return;
        }

        resultados.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.codigo_paciente}</td>
                    <td>${item.nombre_paciente}</td>
                    <td>${item.valor}</td>
                </tr>
            `;
        });
    } catch (e) {
        tbody.innerHTML = "<tr><td colspan='3' class='text-center'>ERROR EN LA CARGA</td></tr>";
    }
}
</script>

</body>
</html>
