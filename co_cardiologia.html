<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Cardiología</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1117; color: white; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00a651; padding-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #00a651; }
        .filter-section { background: #21262d; padding: 20px; border-radius: 6px; margin: 20px 0; display: flex; gap: 10px; align-items: center; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: white; flex-grow: 1; }
        button { padding: 10px 20px; background: #00a651; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; color: black; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #00a651; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">ohs</div>
        <h2>CONSULTA DE CARDIOLOGÍA</h2>
        <button onclick="history.back()">← VOLVER</button>
    </div>

    <div class="filter-section">
        <input type="text" id="filtro_diagnostico" placeholder="Buscar por diagnóstico...">
        <button onclick="filtrar()">FILTRAR</button>
    </div>

    <table>
        <thead>
            <tr><th>CÓDIGO</th><th>PACIENTE</th><th>DIAGNÓSTICO</th></tr>
        </thead>
        <tbody id="tabla_resultados">
            <tr><td colspan="3">INGRESA UN TÉRMINO PARA BUSCAR...</td></tr>
        </tbody>
    </table>
    <br>
    <button onclick="window.print()">IMPRIMIR RESULTADOS</button>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    async function filtrar() {
        const query = document.getElementById('filtro_diagnostico').value;
        const tabla = document.getElementById('tabla_resultados');
        tabla.innerHTML = "<tr><td colspan='3'>CARGANDO DATOS...</td></tr>";

        try {
            // Se asume que en main.py crearás el endpoint /filtrar-cardiologia
            const res = await fetch(`${API}/filtrar-cardiologia?query=${query}`);
            const data = await res.json();
            
            tabla.innerHTML = "";
            data.forEach(item => {
                tabla.innerHTML += `<tr>
                    <td>${item.codigo_paciente}</td>
                    <td>${item.nombre_paciente}</td>
                    <td>${item.diagnostico}</td>
                </tr>`;
            });
        } catch (err) {
            tabla.innerHTML = "<tr><td colspan='3'>ERROR AL CARGAR DATOS</td></tr>";
        }
    }
</script>
</body>
</html>
