<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA - CARDIOLOGÍA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin-top: 20px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #e2e8f0; }
        .logo-container img { height: 60px; }
        .header { text-align: center; margin-bottom: 30px; }
        .filter-box { background: #1e293b; padding: 20px; border-radius: 15px; display: flex; gap: 15px; align-items: center; justify-content: center; }
        .label-patologias { font-weight: bold; font-size: 1.1rem; color: #ffffff; }
        select, button { padding: 10px; border-radius: 8px; border: none; }
        button { background: #22c55e; color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; margin-top: 20px; background: white; color: #0f172a; border-radius: 10px; overflow: hidden; }
        th { background: #334155; color: white; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
        <strong>HISTORIAL_CLINICO</strong>
    </div>

    <div class="header">
        <a href="consultas.html" class="btn btn-secondary btn-sm mb-3 no-print">← VOLVER</a>
        <h2>CONSULTA DE EVALUACIÓN CARDIOLÓGICA</h2>
    </div>

    <div class="filter-box no-print">
        <span class="label-patologias">ANTECEDENTES PATOLÓGICOS</span>
        <select id="estadoSelect" class="form-select w-50">
            <option value="NINEZ">NINEZ</option>
            <option value="ADOLESCENTE">ADOLESCENTE</option>
            <option value="ADULTEZ">ADULTEZ</option>
            <option value="TABAQUISMO">TABAQUISMO</option>
            <option value="HIPERLIPIDEMIAS">HIPERLIPIDEMIAS</option>
            <option value="ASMA_BRONQUIAL">ASMA BRONQUIAL</option>
            <option value="HTA">HTA</option>
            <option value="DIABETES">DIABETES</option>
            <option value="BRONQUITIS">BRONQUITIS</option>
        </select>
        <button type="button" onclick="filtrar()">BUSCAR</button>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>CÓDIGO</th>
                <th>NOMBRE COMPLETO</th>
                <th>ESTADO</th>
            </tr>
        </thead>
        <tbody id="listaPacientes">
            <tr><td colspan="3" class="text-center">Seleccione un antecedente y presione BUSCAR</td></tr>
        </tbody>
    </table>

    <div class="text-center mt-4 no-print">
        <button type="button" onclick="window.print()" class="btn btn-primary">IMPRIMIR RESULTADOS</button>
    </div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    async function filtrar() {
        const filtro = document.getElementById('estadoSelect').value;
        const tbody = document.getElementById('listaPacientes');
        
        tbody.innerHTML = "<tr><td colspan='3' class='text-center'>BUSCANDO...</td></tr>";

        try {
            const url = `${API}/buscar-cardiologia?antecedente=${encodeURIComponent(filtro)}`;
            const res = await fetch(url);
            
            if (!res.ok) throw new Error('Error en la respuesta del servidor');
            
            const resultados = await res.json();
            
            tbody.innerHTML = "";
            
            if (!resultados || resultados.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3' class='text-center'>NO SE ENCONTRARON PACIENTES</td></tr>";
                return;
            }

            resultados.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.codigo || 'N/A'}</td>
                        <td>${item.nombre || 'N/A'}</td>
                        <td>CONFIRMADO</td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error en filtrar:", e);
            tbody.innerHTML = "<tr><td colspan='3' class='text-center text-danger'>ERROR: NO SE PUDO CONECTAR A LA NUBE</td></tr>";
        }
    }
</script>
</body>
</html>
