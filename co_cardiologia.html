<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Cardiología</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f8; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .filter-box { display: flex; gap: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #00a651; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>CONSULTA DE CARDIOLOGÍA</h2>
    <div class="filter-box">
        <input type="text" id="filtroTexto" placeholder="Buscar por diagnóstico...">
        <button onclick="filtrar()">FILTRAR</button>
    </div>
    <table>
        <thead>
            <tr><th>CÓDIGO</th><th>PACIENTE</th><th>DIAGNÓSTICO</th></tr>
        </thead>
        <tbody id="listaPacientes">
            </tbody>
    </table>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    async function filtrar() {
        const filtro = document.getElementById('filtroTexto').value;
        const tbody = document.getElementById('listaPacientes');
        tbody.innerHTML = "<tr><td colspan='3'>CARGANDO...</td></tr>";

        try {
            const res = await fetch(`${API}/consulta-cardiologia/${encodeURIComponent(filtro)}`);
            const data = await res.json();
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `<tr><td>${item.codigo}</td><td>${item.nombre}</td><td>${item.diagnostico}</td></tr>`;
            });
        } catch (e) {
            tbody.innerHTML = "<tr><td colspan='3'>ERROR AL CARGAR DATOS</td></tr>";
        }
    }
</script>
</body>
</html>
