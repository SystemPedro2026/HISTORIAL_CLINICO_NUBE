<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BÚSQUEDA AVANZADA - OHS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; margin-bottom: 20px; }
        .field-group { display: flex; align-items: center; gap: 10px; }
        .field-group label { min-width: 120px; font-weight: 600; color: #333; font-size: 14px; }
        .field-group input, .field-group select { flex-grow: 1; padding: 8px; border: 1px solid #999; border-radius: 4px; text-transform: uppercase; }
        .btn-buscar { grid-column: span 2; padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 14px; border-radius: 5px; }
        
        /* Estilos de tabla e impresión */
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { border-bottom: 2px solid #2c55d0; color: #2c55d0; padding: 12px; text-transform: uppercase; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-transform: uppercase; text-align: center; }
        .col-num { width: 50px; text-align: center; }
        .col-nom { padding-left: 40px !important; text-align: left; }
        
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; text-align: center; }
            .container { box-shadow: none; padding: 0; }
            .footer-print { margin-top: 60px; text-align: center; font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header no-print">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>
    
    <div class="no-print"><h2 class="titulo-informe">BÚSQUEDA AVANZADA</h2></div>

    <div class="search-grid no-print">
        <div class="field-group"><label>SEXO</label><select id="sexo"><option value="">SELECCIONE...</option><option value="MASCULINO">MASCULINO</option><option value="FEMENINO">FEMENINO</option></select></div>
        <div class="field-group"><label>LUGAR NACIMIENTO</label><input type="text" id="lugar" placeholder="LUGAR"></div>
        <div class="field-group"><label>ESTADO CIVIL</label><select id="est_civil"><option value="">SELECCIONE...</option><option value="SOLTERO/A">SOLTERO/A</option><option value="CASADO/A">CASADO/A</option></select></div>
        <div class="field-group"><label>PROFESIÓN</label><input type="text" id="profesion" placeholder="PROFESIÓN"></div>
        <button class="btn-buscar" onclick="buscarPacientes()">BUSCAR PACIENTE</button>
    </div>

    <div id="resultadosContainer"></div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';
    async function buscarPacientes() {
        const container = document.getElementById('resultadosContainer');
        container.innerHTML = "BUSCANDO...";
        try {
            const resp = await fetch(`${API}/pacientes/`);
            const pacientes = await resp.json();
            let encontrados = [];
            for (let p of pacientes) {
                const det = await fetch(`${API}/api/paciente-completo/${p.id}`).then(r => r.json());
                const f = det.filiacion || {};
                if ((!document.getElementById('sexo').value || f.sexo === document.getElementById('sexo').value) &&
                    (!document.getElementById('lugar').value || (f.lugar_nacimiento && f.lugar_nacimiento.includes(document.getElementById('lugar').value.toUpperCase()))) &&
                    (!document.getElementById('est_civil').value || f.estado_civil === document.getElementById('est_civil').value) &&
                    (!document.getElementById('profesion').value || (f.profesion_oficio && f.profesion_oficio.includes(document.getElementById('profesion').value.toUpperCase())))) {
                    encontrados.push({ nombre: `${det.paciente.nombre} ${det.paciente.apellido}`, codigo: det.paciente.codigo_paciente });
                }
            }

            const now = new Date();
            const criterios = [];
            if (document.getElementById('sexo').value) criterios.push(`SEXO: ${document.getElementById('sexo').value}`);
            if (document.getElementById('lugar').value) criterios.push(`LUGAR: ${document.getElementById('lugar').value.toUpperCase()}`);
            if (document.getElementById('est_civil').value) criterios.push(`ESTADO CIVIL: ${document.getElementById('est_civil').value}`);
            if (document.getElementById('profesion').value) criterios.push(`PROFESIÓN: ${document.getElementById('profesion').value.toUpperCase()}`);
            const criterioText = criterios.length > 0 ? `<p style="font-size: 11px; color: #555;">FILTROS: ${criterios.join(' | ')}</p>` : "";

            container.innerHTML = encontrados.length > 0 ? `
                <div class="print-only">
                    <h2>INFORME DE BÚSQUEDA DE PACIENTES</h2>
                    ${criterioText}
                </div>
                <table>
                    <thead><tr><th class="col-num">#</th><th class="col-nom">PACIENTE</th><th>CÓDIGO PACIENTE</th></tr></thead>
                    <tbody>${encontrados.map((p, i) => `<tr><td class="col-num">${i + 1}</td><td class="col-nom">${p.nombre.toUpperCase()}</td><td>${p.codigo.toUpperCase()}</td></tr>`).join('')}</tbody>
                </table>
                <div class="footer-print print-only">
                    <br><br>__________________________<br>FIRMA Y SELLO MÉDICO<br>HISTORIAL CLÍNICO NUBE<br>FECHA: ${now.toLocaleDateString('es-ES')} | HORA: ${now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'})}
                </div>` : "NO SE ENCONTRARON RESULTADOS.";
        } catch(e) { container.innerHTML = "ERROR AL BUSCAR."; }
    }
</script>
</body>
</html>
