<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Consolidado - Historial Clínico Nube</title>
    <style>
        /* Estilos base iguales a informes.html para mantener consistencia */
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { height: 60px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .selector-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-mode { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-box { margin-bottom: 30px; text-align: center; }
        input { padding: 12px; width: 350px; text-transform: uppercase; border: 1px solid #ccc; border-radius: 5px; }
        .btn-buscar { padding: 12px 25px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; }
        .ficha-paciente { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #28a745; }
        .valor-dato { font-size: 1.1em; font-weight: 600; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #2c55d0 !important; color: white !important; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status-icon { font-weight: bold; font-size: 1.2em; }
        .text-green { color: #28a745; }
        .text-red { color: #dc3545; }
        #footerFirma { display: none; text-align: center; margin-top: 50px; }
        .linea-firma { width: 300px; border-top: 1px solid #000; margin: 0 auto 10px auto; }
        @media print {
            .selector-box, .search-box, .btn-nav { display: none !important; }
            #footerFirma { display: block !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="btn-nav" onclick="history.back()">← VOLVER</button>
            <img src="logo.png" alt="Logo" class="logo">
            <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
        </div>
        <h2 class="titulo-informe">BÚSQUEDA POR DATOS</h2>
        <div class="selector-box">
            <button class="btn-mode" style="background-color: #e0e0e0;" onclick="location.href='informes.html'">POR CÓDIGO</button>
            <button class="btn-mode" style="background-color: #28a745; color: white;">POR DATOS</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="datosInput" placeholder="BUSCAR POR NOMBRE, AFILIACIÓN, HÁBITOS O EMPRESA">
            <button class="btn-buscar" onclick="buscarPorCampos()">BUSCAR</button>
        </div>

        <div id="infoPaciente"></div>
        <table id="tablaInforme" style="display:none;">
            <thead><tr><th>EXAMEN</th><th>RESULTADO</th><th>ESTADO</th></tr></thead>
            <tbody id="resultadosBody"></tbody>
        </table>

        <div id="footerFirma">
            <div class="linea-firma"></div>
            <p>FIRMA Y SELLO MÉDICO</p>
            <p>HISTORIAL CLÍNICO NUBE</p>
            <p id="fechaImpresion" style="margin-top: 10px; font-size: 0.9em; color: #555;"></p>
        </div>
    </div>

    <script>
        async function buscarPorCampos() {
            const query = document.getElementById('datosInput').value.trim();
            if(!query) return;

            try {
                // El endpoint debe estar preparado en el Backend para recibir este nuevo parámetro
                const response = await fetch(`https://historial-clinico-nube.onrender.com/api/buscar-detallado?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                document.getElementById('infoPaciente').innerHTML = `
                    <div class="ficha-paciente">
                        <div><span class="label-dato">PACIENTE</span><div class="valor-dato">${data.nombre}</div></div>
                        <div><span class="label-dato">EMPRESA</span><div class="valor-dato">${data.empresa}</div></div>
                    </div>`;
                
                // (Aquí se repite la lógica de construcción de filas usada en informes.html)
                // ... (mismas filas que en informes.html)
                
                document.getElementById('tablaInforme').style.display = 'table';
            } catch (e) { alert("No se encontraron coincidencias en Declaración, Afiliación, Hábitos o Empresa."); }
        }
    </script>
</body>
</html>
