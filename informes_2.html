<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda Avanzada - Historial Clínico Nube</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .search-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .field-group { display: flex; flex-direction: column; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; text-transform: uppercase; }
        .btn-buscar { grid-column: span 2; padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; margin-top: 10px; }
        .ficha-paciente { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #2c55d0; padding: 15px; border-radius: 8px; margin-top: 20px; color: white; }
        .valor-dato { font-size: 1.3em; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #2c55d0; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>
    <h2 class="titulo-informe">BÚSQUEDA AVANZADA</h2>
    
    <div class="search-grid">
        <div class="field-group"><label>SEXO</label><select id="sexo"><option value="">SELECCIONE...</option><option value="MASCULINO">MASCULINO</option><option value="FEMENINO">FEMENINO</option></select></div>
        <div class="field-group"><label>LUGAR</label><input type="text" id="lugar" placeholder="CIUDAD/LUGAR"></div>
        <div class="field-group"><label>ESTADO CIVIL</label><select id="estadoCivil"><option value="">SELECCIONE...</option><option value="SOLTERO">SOLTERO</option><option value="CASADO">CASADO</option></select></div>
        <div class="field-group"><label>PROFESIÓN/LABOR</label><input type="text" id="profesion" placeholder="PROFESIÓN..."></div>
        <div class="field-group" style="grid-column: span 2;"><label>EMPRESA</label><input type="text" id="empresa" placeholder="NOMBRE DE EMPRESA..."></div>
        <button class="btn-buscar" onclick="buscarDetallado()">BUSCAR PACIENTE</button>
    </div>

    <div id="infoPaciente"></div>
    <table id="tablaInforme" style="display:none;">
        <thead><tr><th>EXAMEN</th><th>RESULTADO</th><th>ESTADO</th></tr></thead>
        <tbody id="resultadosBody"></tbody>
    </table>
</div>

<script>
async function buscarDetallado() {
    // 1. Construimos un objeto solo con valores válidos
    const filtros = {};
    const inputs = {
        sexo: document.getElementById('sexo').value,
        lugar: document.getElementById('lugar').value.trim(),
        estado_civil: document.getElementById('estadoCivil').value,
        profesion: document.getElementById('profesion').value.trim(),
        empresa: document.getElementById('empresa').value.trim()
    };

    for (const [key, value] of Object.entries(inputs)) {
        // Solo añadimos el filtro si tiene un valor real
        if (value && value !== "SELECCIONE..." && value !== "CIUDAD/LUGAR" && value !== "PROFESIÓN..." && value !== "NOMBRE DE EMPRESA...") {
            filtros[key] = value.toUpperCase();
        }
    }

    // 2. Si no hay filtros, no buscamos
    if (Object.keys(filtros).length === 0) {
        alert("POR FAVOR, INGRESE AL MENOS UN CRITERIO DE BÚSQUEDA.");
        return;
    }

    try {
        const params = new URLSearchParams(filtros);
        const response = await fetch(`https://historial-clinico-nube.onrender.com/api/buscar-paciente-detallado?${params.toString()}`);
        
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        
        // 3. Renderizado final en MAYÚSCULAS
        document.getElementById('infoPaciente').innerHTML = `
            <div class="ficha-paciente">
                <div><label>PACIENTE</label><div class="valor-dato">${data.datos_generales.nombre.toUpperCase()}</div></div>
                <div><label>CÓDIGO PACIENTE</label><div class="valor-dato">${data.datos_generales.codigo.toUpperCase()}</div></div>
            </div>`;
        
        document.getElementById('tablaInforme').style.display = 'table';
    } catch(e) { 
        alert("NO SE ENCONTRARON RESULTADOS. INTENTE OTRO FILTRO."); 
    }
}  
</script>
</body>
</html>
