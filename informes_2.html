<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda Avanzada - Historial Clínico Nube</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .search-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .field-group { display: flex; flex-direction: column; }
        .habitos-group { grid-column: span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-buscar { grid-column: span 2; padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .ficha-paciente { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .valor-dato { font-size: 1.2em; font-weight: bold; color: #2c55d0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #2c55d0; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>
    <h2 class="titulo-informe">BÚSQUEDA AVANZADA</h2>
    
    <div class="search-grid">
        <div class="field-group"><label>Sexo</label><select id="sexo"><option value="">Seleccione...</option><option value="M">Masculino</option><option value="F">Femenino</option></select></div>
        <div class="field-group"><label>Lugar</label><input type="text" id="lugar" placeholder="Ciudad/Lugar"></div>
        <div class="field-group"><label>Estado Civil</label><select id="estadoCivil"><option value="">Seleccione...</option><option value="Soltero">Soltero/a</option><option value="Casado">Casado/a</option></select></div>
        <div class="field-group"><label>Profesión/Labor</label><input type="text" id="profesion" placeholder="Profesión..."></div>
        <div class="field-group"><label>Empresa</label><input type="text" id="empresa" placeholder="Nombre de empresa..."></div>
        
        <div class="habitos-group">
            <label>Alcohol <select id="hab_alcohol"><option value="SI">SI</option><option value="NO">NO</option></select></label>
            <label>Tabaco <select id="hab_tabaco"><option value="SI">SI</option><option value="NO">NO</option></select></label>
            <label>Drogas <select id="hab_drogas"><option value="SI">SI</option><option value="NO">NO</option></select></label>
            <label>Coca <select id="hab_coca"><option value="SI">SI</option><option value="NO">NO</option></select></label>
        </div>
        <button class="btn-buscar" onclick="buscarDetallado()">BUSCAR PACIENTE</button>
    </div>

    <div id="infoPaciente"></div>
    <table id="tablaInforme" style="display:none;">
        <thead><tr><th>EXAMEN</th><th>RESULTADO</th><th>ESTADO</th></tr></thead>
        <tbody id="resultadosBody"></tbody>
    </table>
</div>

<script>
    async function buscarDetallado() {
        // Recolección de datos de búsqueda
        const params = new URLSearchParams({
            sexo: document.getElementById('sexo').value,
            lugar: document.getElementById('lugar').value,
            estado_civil: document.getElementById('estadoCivil').value,
            profesion: document.getElementById('profesion').value,
            empresa: document.getElementById('empresa').value,
            alc: document.getElementById('hab_alcohol').value,
            tab: document.getElementById('hab_tabaco').value,
            dro: document.getElementById('hab_drogas').value,
            coc: document.getElementById('hab_coca').value
        });

        try {
            const response = await fetch(`https://historial-clinico-nube.onrender.com/api/buscar-paciente-detallado?${params}`);
            const data = await response.json();
            
            // Mostrar Nombre y Código al final de la búsqueda como pediste
            document.getElementById('infoPaciente').innerHTML = `
                <div class="ficha-paciente">
                    <div><label>PACIENTE</label><div class="valor-dato">${data.datos_generales.nombre}</div></div>
                    <div><label>CÓDIGO</label><div class="valor-dato">${data.datos_generales.codigo}</div></div>
                </div>`;
            
            // Lógica de tabla igual a informes.html...
            document.getElementById('tablaInforme').style.display = 'table';
        } catch(e) { alert("No se encontraron pacientes con esos filtros."); }
    }
</script>
</body>
</html>
