<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Consolidado - Historial Clínico Nube</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { height: 60px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .selector-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-mode { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .search-box { margin-bottom: 30px; text-align: center; }
        input { padding: 12px; width: 300px; text-transform: uppercase; border: 1px solid #ccc; border-radius: 5px; }
        .btn-buscar { padding: 12px 25px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; }
        .ficha-paciente { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #2c55d0; }
        .valor-dato { font-size: 1.1em; font-weight: 600; color: #333; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #2c55d0 !important; color: white !important; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .status-icon { font-weight: bold; font-size: 1.2em; }
        .text-green { color: #28a745; }
        .text-red { color: #dc3545; }
        @media print {
            .selector-box, .search-box, .btn-nav, button, input { display: none !important; }
            .container { box-shadow: none !important; border: none !important; width: 100% !important; padding: 0 !important; }
            table { width: 100%; border: 1px solid #ccc; }
            .footer-firma { display: block !important; margin-top: 80px; text-align: center; width: 100%; }
            .linea-firma { width: 300px; border-top: 1px solid #000; margin: 0 auto 10px auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <img src="logo.png" alt="Logo" class="logo">
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>

    <h2 class="titulo-informe">INFORME CONSOLIDADO</h2>

    <div class="selector-box">
        <button id="btn-codigo" class="btn-mode" style="background-color: #2c55d0; color: white;" onclick="cambiarModo('codigo')">POR CÓDIGO</button>
        <button id="btn-datos" class="btn-mode" style="background-color: #e0e0e0;" onclick="location.href='informes_2.html'">POR DATOS</button>
    </div>

    <div class="search-box">
        <input type="text" id="codigoInput" placeholder="INGRESE CÓDIGO PACIENTE">
        <button class="btn-buscar" onclick="buscarInforme()">BUSCAR</button>
    </div>

    <div id="infoPaciente"></div>
    <table id="tablaInforme" style="display:none;">
        <thead><tr><th>EXAMEN</th><th>RESULTADO</th><th>ESTADO</th></tr></thead>
        <tbody id="resultadosBody"></tbody>
    </table>
    <div class="footer-firma" id="footerFirma" style="display:none;">
        <div class="linea-firma"></div>
        <p>FIRMA Y SELLO MÉDICO</p>
        <p>HISTORIAL CLÍNICO NUBE</p>
        <br><br><br><p id="fechaImpresion" style="margin-top: 10px; font-size: 0.9em; color: #555;"></p>
    </div>
</div>

<script>
    function cambiarModo(modo) {
        const btnCodigo = document.getElementById('btn-codigo');
        const btnDatos = document.getElementById('btn-datos');
        const input = document.getElementById('codigoInput');
        if (modo === 'codigo') {
            btnCodigo.style.backgroundColor = '#2c55d0'; btnCodigo.style.color = 'white';
            btnDatos.style.backgroundColor = '#e0e0e0'; btnDatos.style.color = 'black';
        }
    }
    
    function obtenerFecha() {
        const ahora = new Date();
        const fecha = ahora.toLocaleDateString('es-ES');
        const hora = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('fechaImpresion').innerText = `FECHA: ${fecha} | HORA: ${hora}`;
    }
    obtenerFecha();
    
    async function buscarInforme() {
        const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
        if(!codigo) return;

        const url = `https://historial-clinico-nube.onrender.com/api/informe-consolidado/${codigo}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            document.getElementById('infoPaciente').innerHTML = `
                <div class="ficha-paciente">
                    <div><span class="label-dato">PACIENTE</span><div class="valor-dato">${data.datos_generales.nombre}</div></div>
                    <div><span class="label-dato">CÓDIGO</span><div class="valor-dato">${data.datos_generales.codigo}</div></div>
                </div>`;
            
            const body = document.getElementById('resultadosBody');
            body.innerHTML = '';
            const res = data.resultados_medicos;
            
            const filas = [
                ["01. APTITUD OCUPACIONAL", res["01_aptitud_ocupacional"]],
                ["02. APTITUD FÍSICA", res["02_aptitud_fisica_psicologica"]?.fisico],
                ["03. APTITUD PSICOLÓGICA", res["02_aptitud_fisica_psicologica"]?.psico],
                ["04. OSTEOMUSCULAR", res["03_osteomuscular"]],
                ["05. ESPIROMETRÍA", res["04_espirometria"]],
                ["06. OFTALMOLOGÍA", res["05_oftalmologia"]],
                ["07. CARDIOLOGÍA", res["06_cardiologia"]],
                ["08. ELECTROENCEFALOGRAMA", res["07_electroencefalograma"]],
                ["09. ALTURA", res["08_altura"]],
                ["10. DECLARACIÓN JURADA", res["09_declaracion_jurada"]],
                ["11. HISTORIAL CLÍNICO", res["10_historial_clinico"]],
                ["12. PSICOLOGÍA DETALLADA", res["11_psicologia_detallada"]]
            ];

            filas.forEach(f => {
                const val = f[1];
                // Lógica estricta: solo es válido si no es nulo, vacío ni "SIN EXAMEN"
                const esValido = (val !== null && val !== undefined && 
                                 String(val).toUpperCase() !== "SIN EXAMEN" && 
                                 String(val).trim() !== "");
                
                const valorDisplay = esValido ? String(val).toUpperCase() : "SIN EXAMEN";
                const icono = esValido ? '<span class="status-icon text-green">✔</span>' : '<span class="status-icon text-red">✘</span>';
                
                body.innerHTML += `<tr><td>${f[0]}</td><td style="text-align: center">${valorDisplay}</td><td style="text-align: center">${icono}</td></tr>`;
            });
            
            document.getElementById('tablaInforme').style.display = 'table';
            document.getElementById('footerFirma').style.display = 'block';
        } catch (e) { 
            alert("Error al cargar los datos del paciente."); 
        }
    }
</script>
</body>
</html>
