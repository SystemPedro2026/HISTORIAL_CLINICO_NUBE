<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Consolidado - Historial Clínico Nube</title>
    <style>
        /* Estilos generales */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Título Elegante */
        .titulo-informe { text-align: center; color: #2c55d0; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        
        /* Ficha de Datos del Paciente */
        .ficha-paciente { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #2c55d0; }
        .dato-item { display: flex; flex-direction: column; }
        .label-dato { font-size: 0.8em; color: #666; text-transform: uppercase; font-weight: bold; }
        .valor-dato { font-size: 1.1em; font-weight: 600; color: #333; }
        
        /* Tabla Estilizada */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #2c55d0 !important; color: white !important; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        /* Media Query de Impresión (Lo que ocultaremos) */
        @media print {
            .header, .selector-box, .search-box, .btn-nav { display: none !important; }
            .container { box-shadow: none !important; border: none !important; }
            .footer-firma { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <img src="logo.png" alt="Logo OHS" class="logo"> <!-- Asegúrate de tener tu logo.png -->
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>

    <h2 class="titulo-informe">INFORME CONSOLIDADO</h2>

    <div class="selector-box">
        <button id="btn-codigo" class="btn-mode" style="background-color: #2c55d0; color: white;" onclick="cambiarModo('codigo')">POR CÓDIGO</button>
        <button id="btn-datos" class="btn-mode" style="background-color: #e0e0e0;" onclick="cambiarModo('datos')">POR DATOS</button>
    </div>

    <div class="search-box">
        <input type="text" id="codigoInput" placeholder="INGRESE CÓDIGO PACIENTE">
        <button onclick="buscarInforme()">BUSCAR</button>
    </div>

    <div id="infoPaciente"></div>
    <table id="tablaInforme" style="display:none;">
        <thead><tr><th>EXAMEN</th><th>RESULTADO</th></tr></thead>
        <tbody id="resultadosBody"></tbody>
    </table>
    <div class="footer-firma" style="display:none;">
        <div class="linea-firma"></div>
        <p>FIRMA Y SELLO MÉDICO</p>
        <p>HISTORIAL CLÍNICO NUBE</p>
    </div>
    
</div>

<script>
    function cambiarModo(modo) {
        const btnCodigo = document.getElementById('btn-codigo');
        const btnDatos = document.getElementById('btn-datos');
        const input = document.getElementById('codigoInput');

        if (modo === 'codigo') {
            btnCodigo.style.backgroundColor = '#2c55d0';
            btnCodigo.style.color = 'white';
            btnDatos.style.backgroundColor = '#e0e0e0';
            btnDatos.style.color = 'black';
            input.placeholder = 'INGRESE CÓDIGO PACIENTE';
        } else {
            btnCodigo.style.backgroundColor = '#e0e0e0';
            btnCodigo.style.color = 'black';
            btnDatos.style.backgroundColor = '#28a745';
            btnDatos.style.color = 'white';
            input.placeholder = 'INGRESE NOMBRE O C.I.';
        }
    }

    async function buscarInforme() {
        // Lógica de búsqueda (se mantiene igual, mañana la expandimos para modo DATOS)
        const codigo = document.getElementById('codigoInput').value.toUpperCase();
        const url = `https://historial-clinico-nube.onrender.com/api/informe-consolidado/${codigo}`;
    
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error();
            const data = await response.json();
            
            document.getElementById('infoPaciente').innerHTML = `
                <div class="ficha-paciente">
                    <div class="dato-item">
                        <span class="label-dato">NOMBRE DEL PACIENTE</span>
                        <span class="valor-dato">${data.datos_generales.nombre}</span>
                    </div>
                    <div class="dato-item">
                        <span class="label-dato">CÓDIGO DE PACIENTE</span>
                        <span class="valor-dato">${data.datos_generales.codigo}</span>
                    </div>
                </div>
            `;
    
            const res = data.resultados_medicos;
            const filas = [
                ["Aptitud Ocupacional", res["01_aptitud_ocupacional"]],
                ["Aptitud Física", res["02_aptitud_fisica_psicologica"]?.fisico],
                ["Aptitud Psicológica", res["02_aptitud_fisica_psicologica"]?.psico],
                ["Osteomuscular", res["03_osteomuscular"]],
                ["Espirometría", res["04_espirometria"]],
                ["Oftalmología", res["05_oftalmologia"]],
                ["Cardiología", res["06_cardiologia"]],
                ["Electroencefalograma", res["07_electroencefalograma"]],
                ["Altura", res["08_altura"]],
                ["Declaración Jurada", res["09_declaracion_jurada"]],
                ["Historial Clínico", res["10_historial_clinico"]],
                ["Psicología Detallada", res["11_psicologia_detallada"]]
            ];
    
            filas.forEach(f => {
                body.innerHTML += `<tr><td>${f[0].toUpperCase()}</td><td>${(f[1] || 'SIN DATOS').toUpperCase()}</td></tr>`;
            });
            document.getElementById('tablaInforme').style.display = 'table';
    
        } catch (error) {
            alert("Paciente no encontrado o error en el servidor");
        }
    }
</script>
</body>
</html>
