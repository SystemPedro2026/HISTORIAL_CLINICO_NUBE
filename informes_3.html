<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BÚSQUEDA PERSONAL - OHS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { background: white; max-width: 900px; margin: auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-nav { padding: 10px 20px; cursor: pointer; background: #2c55d0; color: white; border: none; border-radius: 6px; font-weight: bold; }
        .titulo-informe { text-align: center; color: #2c55d0; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; border-bottom: 3px solid #2c55d0; padding-bottom: 10px; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; margin-bottom: 20px; }
        .field-group { display: flex; align-items: center; gap: 10px; }
        .field-group label { min-width: 120px; font-weight: 600; color: #333; font-size: 14px; }
        .field-group input, .field-group select { flex-grow: 1; padding: 8px; border: 1px solid #999; border-radius: 4px; text-transform: uppercase; }
        .btn-buscar { grid-column: span 2; padding: 15px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 14px; border-radius: 5px; }
        
        /* Estilos de tabla e impresión */
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { border-bottom: 2px solid #2c55d0; color: #2c55d0; padding: 12px; text-transform: uppercase; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-transform: uppercase; text-align: center; }
        .col-num { width: 50px; text-align: center; }
        .col-nom { padding-left: 20px !important; text-align: left; }
        
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; text-align: center; }
            .container { box-shadow: none; padding: 0; }
            .footer-print { margin-top: 60px; text-align: center; font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header no-print">
        <button class="btn-nav" onclick="history.back()">← VOLVER</button>
        <button class="btn-nav" onclick="window.print()">IMPRIMIR</button>
    </div>
    
    <div class="no-print"><h2 class="titulo-informe">BÚSQUEDA PERSONAL</h2></div>

    <div class="search-grid no-print">
        <div class="field-group">
            <label>PROFESIONAL</label>
            <select id="tipoProfesional">
                <option value="">TODOS...</option>
                <option value="DOCTOR">DOCTOR</option>
                <option value="ENFERMERA">ENFERMERA</option>
            </select>
        </div>
        <div class="field-group">
            <label>TURNO</label>
            <select id="turno">
                <option value="">TODOS...</option>
                <option value="MAÑANA">MAÑANA</option>
                <option value="TARDE">TARDE</option>
                <option value="NOCHE">NOCHE</option>
            </select>
        </div>
        <div class="field-group" style="grid-column: span 2;">
            <label>ESPECIALIDAD</label>
            <select id="especialidad">
                <option value="">TODAS...</option>
                <option value="MEDICINA GENERAL">MEDICINA GENERAL</option>
                <option value="OFTALMOLOGÍA">OFTALMOLOGÍA</option>
                <option value="PSICOLOGÍA">PSICOLOGÍA</option>
                <option value="ESPIROMETRÍA">ESPIROMETRÍA</option>
                <option value="ELECTROENCEFALOGRAMA">ELECTROENCEFALOGRAMA</option>
                <option value="CARDIOLOGÍA">CARDIOLOGÍA</option>
                <option value="NEUROLOGÍA">NEUROLOGÍA</option>
                <option value="TRABAJO CON ALTURA">TRABAJO CON ALTURA</option>
                <option value="APTITUD LABORAL">APTITUD LABORAL</option>
                <option value="FISICA - PSICOLOGICA">FISICA - PSICOLOGICA</option>
                <option value="OSTEOMUSCULAR">OSTEOMUSCULAR</option>
                <option value="ENFERMERIA GENERAL">ENFERMERIA GENERAL</option>
                <option value="ENFERMERIA INSTRUMENTAL">ENFERMERIA INSTRUMENTAL</option>
            </select>
        </div>
        <button class="btn-buscar" onclick="buscarPersonal()">BUSCAR PERSONAL</button>
    </div>

    <div id="resultadosContainer"></div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    function normalizar(texto) {
        return (texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
    }

    async function buscarPersonal() {
        const container = document.getElementById('resultadosContainer');
        container.innerHTML = "BUSCANDO...";
        try {
            const tipo = document.getElementById('tipoProfesional').value;
            const turnoFiltro = document.getElementById('turno').value;
            const espFiltro = normalizar(document.getElementById('especialidad').value);

            let encontrados = [];

            const resp = await fetch(`${API}/personal/`);
            if (resp.ok) {
                const data = await resp.json();
                
                const doctores = (data.doctores || []).map(d => ({
                    ci: d.ci_doc || '',
                    nombre: `${d.nombre_doc || ''} ${d.appaterno_doc || ''} ${d.apmaterno_doc || ''}`.trim(),
                    especialidad: d.especialidad || '',
                    turno: d.turno_doc || '',
                    tipo: 'DOCTOR'
                }));

                const enfermeras = (data.enfermeras || []).map(e => ({
                    ci: e.ci_enfe || '',
                    nombre: `${e.nombre_enfe || ''} ${e.appaterno_enfe || ''} ${e.apmaterno_enfe || ''}`.trim(),
                    especialidad: e.especialidad || '',
                    turno: e.turno_enfe || '',
                    tipo: 'ENFERMERA'
                }));

                const personalTotal = [...doctores, ...enfermeras];

                encontrados = personalTotal.filter(p => {
                    const matchTipo = !tipo || p.tipo === tipo;
                    const matchTurno = !turnoFiltro || normalizar(p.turno) === turnoFiltro;
                    const matchEsp = !espFiltro || normalizar(p.especialidad) === espFiltro;
                    return matchTipo && matchTurno && matchEsp;
                });
            }

            const now = new Date();
            const criterios = [];
            if (tipo) criterios.push(`PROFESIONAL: ${tipo}`);
            if (turnoFiltro) criterios.push(`TURNO: ${turnoFiltro}`);
            if (document.getElementById('especialidad').value) criterios.push(`ESPECIALIDAD: ${document.getElementById('especialidad').value.toUpperCase()}`);
            const criterioText = criterios.length > 0 ? `<p style="font-size: 11px; color: #555;">FILTROS: ${criterios.join(' | ')}</p>` : "";

            container.innerHTML = encontrados.length > 0 ? `
                <div class="print-only">
                    <h2>INFORME DE BÚSQUEDA DE PERSONAL MÉDICO</h2>
                    ${criterioText}
                </div>
                <table>
                    <thead>
                        <tr>
                            <th class="col-num">#</th>
                            <th>PROFESIONAL</th>
                            <th class="col-nom">NOMBRE COMPLETO</th>
                            <th>ESPECIALIDAD / CARGO</th>
                            <th>TURNO</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${encontrados.map((p, i) => `
                            <tr>
                                <td class="col-num">${i + 1}</td>
                                <td>${p.tipo}</td>
                                <td class="col-nom">${p.nombre.toUpperCase()}</td>
                                <td>${p.especialidad.toUpperCase()}</td>
                                <td>${p.turno.toUpperCase()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="footer-print print-only">
                    <br><br>__________________________<br>FIRMA Y SELLO MÉDICO<br>HISTORIAL CLÍNICO NUBE<br>FECHA: ${now.toLocaleDateString('es-ES')} | HORA: ${now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'})}
                </div>` : "NO SE ENCONTRARON RESULTADOS.";
        } catch(e) { container.innerHTML = "ERROR AL BUSCAR."; }
    }
</script>
</body>
</html>
