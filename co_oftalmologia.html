<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSULTA - OFTALMOLOGÍA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 900px; margin-top: 20px; }
        .logo-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; color: #e2e8f0; }
        .logo-container img { height: 60px; }
        .header { text-align: center; margin-bottom: 30px; }
        .filter-box { background: #1e293b; padding: 20px; border-radius: 15px; display: flex; gap: 15px; align-items: center; justify-content: center; }
        .label-patologias { font-weight: bold; font-size: 1.1rem; color: #ffffff; }
        select, button { padding: 10px; border-radius: 8px; border: none; }
        button { background: #22c55e; color: white; font-weight: bold; }
        table { width: 100%; margin-top: 20px; background: white; color: #0f172a; border-radius: 10px; overflow: hidden; }
        th { background: #334155; color: white; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo">
        <strong>HISTORIAL_CLINICO</strong>
    </div>

    <div class="header">
        <a href="consultas.html" class="btn btn-secondary btn-sm mb-3 no-print">← VOLVER</a>
        <h2>CONSULTA DE FICHA OFTALMOLÓGICA</h2>
    </div>

    <div class="filter-box no-print">
        <span class="label-patologias">PATOLOGÍAS</span>
        <select id="patologiaSelect" class="form-select w-50">
            <option value="lentes">USA LENTES</option>
            <option value="estrabismo">ESTRABISMO</option>
            <option value="daltonismo">DALTONISMO</option>
            <option value="infecciones">INFECCIONES</option>
            <option value="diabetes">DIABETES</option>
            <option value="presion_alta">PRESIÓN ALTA</option>
        </select>
        <button onclick="filtrar()">BUSCAR</button>
    </div>

    <table class="table table-bordered" id="tablaResultados">
        <thead>
            <tr>
                <th>CÓDIGO</th>
                <th>NOMBRE COMPLETO</th>
                <th>DETALLE</th>
            </tr>
        </thead>
        <tbody id="listaPacientes"></tbody>
    </table>

    <div class="text-center mt-4 no-print">
        <button onclick="window.print()" class="btn btn-primary">IMPRIMIR RESULTADOS</button>
    </div>
</div>

<script>
    const API = 'https://historial-clinico-nube.onrender.com';

    async function filtrar() {
        const campo = document.getElementById('patologiaSelect').value;
        const tbody = document.getElementById('listaPacientes');
        tbody.innerHTML = "<tr><td colspan='3' class='text-center'>CARGANDO DATOS...</td></tr>";

        try {
            const res = await fetch(`${API}/pacientes/`);
            const pacientes = await res.json();
            
            tbody.innerHTML = "";
            let encontrados = 0;

            for (let p of pacientes) {
                try {
                    // Consultamos la ficha oftalmo específica por paciente
                    const resFicha = await fetch(`${API}/ficha-oftalmo/${p.id}`);
                    if (!resFicha.ok) continue; 
                    
                    const ficha = await resFicha.json();

                    // Verificamos si el campo (patología) es "SI"
                    if (ficha[campo] && ficha[campo].toUpperCase() === "SI") {
                        encontrados++;
                        tbody.innerHTML += `
                            <tr>
                                <td>${p.codigo_paciente || '---'}</td>
                                <td>${p.apellido} ${p.nombre}</td>
                                <td>TIENE: ${campo.toUpperCase()}</td>
                            </tr>
                        `;
                    }
                } catch (err) {
                    console.error("Error al traer ficha del paciente", p.id);
                }
            }

            if (encontrados === 0) tbody.innerHTML = "<tr><td colspan='3' class='text-center'>NO SE ENCONTRARON PACIENTES CON ESTA CONDICIÓN</td></tr>";
            
        } catch (e) {
            console.error(e);
            alert("Error al conectar con la nube.");
            tbody.innerHTML = "";
        }
    }
</script>

</body>
</html>
