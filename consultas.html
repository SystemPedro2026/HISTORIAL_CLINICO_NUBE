<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas - Historial Clínico</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .header-nav {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-link {
            color: #5d6d7e;
            text-decoration: none;
            font-size: 1rem;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            color: #a0a0a0;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Grid con el tamaño original de los botones */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .btn-card {
            background-color: #1a1f26;
            border: 1px solid #2d343d;
            border-radius: 15px;
            padding: 60px 20px; /* Padding original para mantener el tamaño robusto */
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-card:hover {
            border-color: #4a90e2;
        }

        .btn-declaracion {
            border-color: #e67e22;
        }

        .icon { font-size: 3rem; }
        .label { font-weight: bold; font-size: 1rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="d_menu.html" class="back-link">← VOLVER</a>
        <h1>CONSULTAS</h1>
        <div style="width: 80px;"></div>
    </div>

    <div class="container">
        <div class="grid-menu">
            <a href="#" class="btn-card btn-declaracion">
                <span class="icon">📝</span>
                <span class="label">DECLARACIÓN JURADA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">👁️</span>
                <span class="label">OFTALMOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🧠</span>
                <span class="label">PSICOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🫁</span>
                <span class="label">ESPIROMETRÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">📈</span>
                <span class="label">ELECTROENCEFALOGRAMA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">❤️</span>
                <span class="label">CARDIOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🦺</span>
                <span class="label">TRABAJO CON ALTURA</span>
            </a>
        </div>
    </div>

</body>
</html>
