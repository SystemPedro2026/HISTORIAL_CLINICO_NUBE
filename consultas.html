<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas - Historial Clínico</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .header-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .back-link {
            color: #5d6d7e;
            text-decoration: none;
            font-size: 0.9rem;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            color: #a0a0a0;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        /* Grid configurado para que los elementos sean cuadrados */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .btn-card {
            background-color: #1a1f26;
            border: 1px solid #2d343d;
            border-radius: 12px;
            /* Se mantiene el padding grande para mantener el tamaño original */
            padding: 50px 20px; 
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centrado vertical para forma cuadrada */
            gap: 15px;
            aspect-ratio: 1 / 1; /* Fuerza la forma cuadrada */
        }

        .btn-card:hover {
            border-color: #4a90e2;
            transform: translateY(-5px);
        }

        /* Estilo para el botón de Declaración Jurada */
        .btn-declaracion {
            border-color: #e67e22;
        }
        
        .btn-declaracion:hover {
            border-color: #f39c12;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.3);
        }

        .icon { font-size: 2.5rem; }
        .label { font-weight: bold; font-size: 0.9rem; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="d_menu.html" class="back-link">← VOLVER</a>
        <h1>CONSULTAS</h1>
        <div style="width: 80px;"></div>
    </div>

    <div class="container">
        <div class="grid-menu">
            <a href="#" class="btn-card btn-declaracion">
                <span class="icon">📝</span>
                <span class="label">DECLARACIÓN JURADA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">👁️</span>
                <span class="label">OFTALMOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🧠</span>
                <span class="label">PSICOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🫁</span>
                <span class="label">ESPIROMETRÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">📈</span>
                <span class="label">ELECTROENCEFALOGRAMA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">❤️</span>
                <span class="label">CARDIOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🦺</span>
                <span class="label">TRABAJO CON ALTURA</span>
            </a>
        </div>
    </div>

</body>
</html>
