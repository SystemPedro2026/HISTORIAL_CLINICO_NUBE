<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas - Historial Clínico</title>
    <style>
        /* Reset y base */
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Encabezado */
        .header-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-link {
            color: #5d6d7e;
            text-decoration: none;
            font-size: 0.9rem;
            margin-right: auto;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            color: #a0a0a0;
            margin: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Contenedor Grid optimizado */
        .container {
            width: 100%;
            max-width: 600px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        /* Botones estilo Card */
        .btn-card {
            background-color: #1a1f26;
            border: 1px solid #2d343d;
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-card:hover {
            border-color: #4a90e2;
            background-color: #212830;
        }

        /* Estilo para el pilar de Declaración Jurada */
        .btn-declaracion {
            border-color: #e67e22;
        }

        .icon { font-size: 1.8rem; }
        .label { font-weight: bold; font-size: 0.8rem; letter-spacing: 1px; text-align: center; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="d_menu.html" class="back-link">← VOLVER</a>
        <h1>CONSULTAS</h1>
    </div>

    <div class="container">
        <div class="grid-menu">
            <a href="#" class="btn-card btn-declaracion">
                <span class="icon">📝</span>
                <span class="label">DECLARACIÓN JURADA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">👁️</span>
                <span class="label">OFTALMOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🧠</span>
                <span class="label">PSICOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🫁</span>
                <span class="label">ESPIROMETRÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">📈</span>
                <span class="label">ELECTROENCEFALOGRAMA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">❤️</span>
                <span class="label">CARDIOLOGÍA</span>
            </a>

            <a href="#" class="btn-card">
                <span class="icon">🦺</span>
                <span class="label">TRABAJO CON ALTURA</span>
            </a>
        </div>
    </div>

</body>
</html>
